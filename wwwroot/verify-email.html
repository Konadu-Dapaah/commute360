<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commute360 — Verify email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Figtree", system-ui, sans-serif;
      color: #e8eefc;
      background: radial-gradient(900px 500px at 10% -10%, rgba(20,184,166,.35), transparent 60%),
                  radial-gradient(800px 500px at 100% 110%, rgba(251,191,36,.25), transparent 60%), #0a1628;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      padding: 28px;
      text-align: center;
    }
    .brand { font-weight: 800; letter-spacing: .02em; margin-bottom: 18px; font-size: 18px; }
    .brand span { color: #fbbf24; }
    h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.2; }
    .sub { margin: 0 0 20px; opacity: .85; line-height: 1.5; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      font-size: 16px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      background: linear-gradient(135deg, #ffb800, #e8920a);
      color: #1a1000;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Commute<span>360</span></div>
    <h1>Email verification</h1>
    <p class="sub" id="status">Checking your link…</p>
    <a class="btn" id="go" href="/login.html" hidden>Continue to log in</a>
  </main>

  <script>
    const apiBase = (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || "";
    const token = new URLSearchParams(window.location.search).get("token");
    const status = document.getElementById("status");
    const go = document.getElementById("go");

    (async function () {
      if (!token) {
        status.textContent = "This link is missing its token. Open the link from your email again.";
        go.hidden = false;
        return;
      }

      try {
        const res = await fetch(apiBase + "/api/account/verify-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token })
        });

        if (res.ok) {
          status.textContent = "Your email is verified. Thank you!";
        } else if (res.status === 429) {
          status.textContent = "Too many attempts. Wait a minute and refresh this page.";
        } else {
          status.textContent = "This verification link is invalid or has expired. Log in and request a new one from your account page.";
        }
      } catch {
        status.textContent = "Could not reach the server.";
      } finally {
        go.hidden = false;
      }
    })();
  </script>
</body>
</html>
