<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commute360 — Verify email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/dash.css" />
  <!-- Configuration script providing APP_CONFIG -->
  <script src="config.js"></script>
  <style>
    /* Built in so this page looks right even if css/dash.css fails to load */
    .dash { color: #e8eefc; }
    .panel { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 24px; color: #e8eefc; }
    .auth-card { max-width: 460px; margin: 0 auto; }
    .muted { opacity: .7; }
    .form { display: grid; gap: 14px; }
    .form label { display: block; font-size: 13px; opacity: .8; margin-bottom: 6px; }
    .input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(10,22,40,.7); color: #e8eefc; font: inherit; }
    .cta { display: inline-block; padding: 14px 28px; border-radius: 12px; border: 0; font: inherit; font-weight: 700; text-decoration: none; background: linear-gradient(135deg, #ffb800, #e8920a); color: #1a1000; cursor: pointer; }
    .msg { font-size: 14px; min-height: 20px; }
    .msg.is-error { color: #fca5a5; }
    .msg.is-success { color: #6ee7b7; }
    .link { color: #7dd3fc; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene__grid"></div>
    <div class="scene__orb scene__orb--a"></div>
    <div class="scene__orb scene__orb--b"></div>
  </div>

  <main class="dash" style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <div class="panel auth-card" style="width:100%;text-align:center">
      <h1 style="margin:0 0 10px;font-size:26px">Email verification</h1>
      <p id="status" class="muted">Checking your link…</p>
      <p style="margin-top:18px"><a class="cta" href="/index.html">Continue to Commute360</a></p>
    </div>
  </main>

  <script>
    const apiBase = (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || "";
    const token = new URLSearchParams(window.location.search).get("token");
    const status = document.getElementById("status");

    (async function () {
      if (!token) { status.textContent = "This link is missing its token."; return; }

      try {
        const res = await fetch(apiBase + "/api/account/verify-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token })
        });

        if (res.ok) {
          status.textContent = "Your email is verified. Thank you!";
        } else if (res.status === 429) {
          status.textContent = "Too many attempts. Wait a minute and refresh this page.";
        } else {
          status.textContent = "This verification link is invalid or has expired. Log in and request a new one from your account page.";
        }
      } catch {
        status.textContent = "Could not reach the server.";
      }
    })();
  </script>
</body>
</html>
