<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commute360 — Track Your Bus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/routes.css" />
  <!-- Configuration script providing Render API_BASE and Google Maps API Key -->
  <script src="/config.js"></script>
  <style>
    [hidden] { display: none !important; }
    .track-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
    @media (max-width: 900px) { .track-layout { grid-template-columns: 1fr; } }
    .panel { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 16px; color: #e8eefc; }
    .panel h2 { margin: 0 0 10px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
    #map { width: 100%; height: 62vh; min-height: 360px; border-radius: 12px; background: #0f1d33; }
    .map-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; background: rgba(255,255,255,.1); }
    .pill::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #8b97ad; }
    .pill.is-live::before { background: #34d399; box-shadow: 0 0 0 4px rgba(52,211,153,.25); }
    .pill.is-stale::before { background: #fbbf24; }
    .follow { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
    .trip-info { font-size: 14px; opacity: .85; margin-bottom: 10px; }
    .eta { padding: 10px 12px; border-radius: 12px; background: rgba(56,189,248,.14); border: 1px solid rgba(56,189,248,.4); margin-bottom: 10px; font-size: 14px; font-weight: 600; }
    .alert-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; max-height: 62vh; overflow-y: auto; }
    .alert { border-radius: 12px; padding: 10px 12px; font-size: 14px; border-left: 4px solid #60a5fa; background: rgba(96,165,250,.12); }
    .alert--warn { border-color: #fbbf24; background: rgba(251,191,36,.12); }
    .alert--danger { border-color: #f87171; background: rgba(248,113,113,.14); }
    .alert__head { font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; opacity: .8; margin-bottom: 4px; }
    .alert.is-new { animation: flash 1.6s ease-out 2; }
    @keyframes flash { 0%,100% { transform: none; } 50% { transform: scale(1.02); box-shadow: 0 0 0 3px rgba(255,255,255,.35); } }
    .empty { opacity: .65; font-size: 14px; }
    .notice { padding: 24px; text-align: center; color: #e8eefc; }
    .notice a { color: #7dd3fc; }
    .stop-dot { width: 26px; height: 26px; border-radius: 50%; background: #475569; color: #fff; border: 2px solid #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
    .stop-dot--board { background: #16a34a; }
    .stop-dot--drop { background: #dc2626; }
    .bus-dot { width: 42px; height: 42px; border-radius: 50%; background: #fbbf24; border: 3px solid #0a1628; display: grid; place-items: center; font-size: 22px; box-shadow: 0 0 0 6px rgba(251,191,36,.3), 0 4px 10px rgba(0,0,0,.5); }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene__grid"></div>
    <div class="scene__orb scene__orb--a"></div>
    <div class="scene__orb scene__orb--b"></div>
  </div>

  <div class="page-shell">
    <header class="topbar">
      <a class="topbar__brand" href="/routes.html">
        <span class="topbar__name">Commute<span>360</span></span>
      </a>
      <div class="topbar__actions">
        <a class="ghost-btn" href="/routes.html">Routes</a>
        <button type="button" class="ghost-btn" id="logoutBtn">Sign out</button>
      </div>
    </header>

    <div class="page-header">
      <h1>Track your bus</h1>
      <p id="subtitle">Loading your booking…</p>
    </div>

    <div class="panel notice" id="noBooking" hidden>
      <p>You don't have an active booking yet.</p>
      <p><a href="/routes.html">Pick a route</a> and come back to see your bus live.</p>
    </div>

    <div class="track-layout" id="trackLayout" hidden>
      <section class="panel">
        <div class="map-bar">
          <span class="pill" id="busPill">Waiting for bus…</span>
          <label class="follow"><input type="checkbox" id="followBus" checked /> Follow bus</label>
        </div>
        <div class="trip-info" id="tripInfo"></div>
        <div class="eta" id="etaBox" hidden></div>
        <div id="map"></div>
      </section>

      <aside class="panel">
        <h2>Driver alerts</h2>
        <p class="empty" id="alertEmpty">No alerts from the driver. New ones will appear here.</p>
        <ul class="alert-list" id="alertList" aria-live="polite"></ul>
      </aside>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token") || localStorage.getItem("authToken");
    if (!token) window.location.href = "/login.html";

    const apiBase = (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || "";
    const cfg = window.APP_CONFIG || {};
    const POLL_MS = 4000;
    const STALE_MS = 45000;

    const $ = (id) => document.getElementById(id);
    const ALERT_LABELS = { Delay: "Delay", Traffic: "Traffic", Breakdown: "Breakdown", Info: "Info", Emergency: "EMERGENCY" };
    const ALERT_CLASS = { Delay: "alert--warn", Traffic: "alert--warn", Breakdown: "alert--danger", Info: "", Emergency: "alert--danger" };

    let map, busMarker = null, busPos = null;
    let routeId = null;
    let lastAlertId = 0;
    let stopsOrdered = [];
    let myBooking = null;

    async function api(path) {
      if (window.Auth && typeof window.Auth.api === "function") {
        return window.Auth.api(path);
      }
      const res = await fetch(apiBase + path, { headers: { Authorization: "Bearer " + token } });
      if (res.status === 401) {
        localStorage.removeItem("token");
        localStorage.removeItem("authToken");
        window.location.href = "/login.html";
        throw new Error("Unauthorized");
      }
      return res;
    }

    window.gm_authFailure = () => {
      $("busPill").textContent = "Google Maps rejected the API key";
    };

    function loadGoogleMaps() {
      return new Promise((resolve, reject) => {
        if (!cfg || !cfg.GOOGLE_MAPS_API_KEY || cfg.GOOGLE_MAPS_API_KEY.startsWith("PASTE")) {
          reject(new Error("Add your Google Maps API key to config.js"));
          return;
        }
        window.__mapsReady = resolve;
        const s = document.createElement("script");
        s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(cfg.GOOGLE_MAPS_API_KEY) +
                "&callback=__mapsReady&loading=async&libraries=marker&v=weekly";
        s.async = true;
        s.onerror = () => reject(new Error("Google Maps failed to load"));
        document.head.appendChild(s);
      });
    }

    function makeStopEl(label, kind) {
      const el = document.createElement("div");
      el.className = "stop-dot" + (kind ? ` stop-dot--${kind}` : "");
      el.textContent = label;
      return el;
    }

    function buildMap(route, booking) {
      const { AdvancedMarkerElement } = google.maps.marker;

      const stops = (route.stops || [])
        .filter((s) => s.latitude != null && s.longitude != null)
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

      stopsOrdered = stops;
      myBooking = booking;

      map = new google.maps.Map($("map"), {
        center: stops.length ? { lat: stops[0].latitude, lng: stops[0].longitude } : (cfg.DEFAULT_CENTER || { lat: 5.6037, lng: -0.1870 }),
        zoom: 14,
        mapId: cfg.MAP_ID,
        streetViewControl: false,
        mapTypeControl: false
      });

      if (stops.length) {
        const path = stops.map((s) => ({ lat: s.latitude, lng: s.longitude }));
        new google.maps.Polyline({ map, path, strokeColor: "#38bdf8", strokeOpacity: 0.9, strokeWeight: 5 });

        const bounds = new google.maps.LatLngBounds();
        stops.forEach((s, i) => {
          const kind = s.id === booking.boardingStopId ? "board" : s.id === booking.dropOffStopId ? "drop" : "";
          new AdvancedMarkerElement({
            map,
            position: { lat: s.latitude, lng: s.longitude },
            title: s.name,
            content: makeStopEl(String(i + 1), kind)
          });
          bounds.extend({ lat: s.latitude, lng: s.longitude });
        });
        map.fitBounds(bounds, 60);
      } else {
        $("tripInfo").textContent += " (This route's stops have no coordinates yet, so only the bus will show.)";
      }
    }

    function moveBus(target) {
      const { AdvancedMarkerElement } = google.maps.marker;

      if (!busMarker) {
        const el = document.createElement("div");
        el.className = "bus-dot";
        el.textContent = "🚌";
        busMarker = new AdvancedMarkerElement({ map, position: target, content: el, title: "Your bus", zIndex: 999 });
        busPos = target;
        map.panTo(target);
        return;
      }

      const from = { ...busPos };
      const start = performance.now();
      const duration = 1500;

      function step(now) {
        const t = Math.min((now - start) / duration, 1);
        busPos = {
          lat: from.lat + (target.lat - from.lat) * t,
          lng: from.lng + (target.lng - from.lng) * t
        };
        busMarker.position = busPos;
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);

      if ($("followBus").checked) map.panTo(target);
    }

    function setPill(state, text) {
      const pill = $("busPill");
      pill.className = "pill" + (state ? ` is-${state}` : "");
      pill.textContent = text;
    }

    function ageText(ms) {
      const s = Math.round(ms / 1000);
      if (s < 60) return `${s}s`;
      const m = Math.round(s / 60);
      return `${m} min`;
    }

    function km(a, b) {
      const R = 6371, rad = Math.PI / 180;
      const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
      const x = Math.sin(dLat / 2) ** 2 +
                Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(x));
    }

    function updateEta(d, stale) {
      const box = $("etaBox");
      if (!myBooking || stopsOrdered.length < 2 || stale) { box.hidden = true; return; }

      const boardIdx = stopsOrdered.findIndex((s) => s.id === myBooking.boardingStopId);
      if (boardIdx < 0) { box.hidden = true; return; }

      const bus = { lat: d.latitude, lng: d.longitude };
      const pts = stopsOrdered.map((s) => ({ lat: s.latitude, lng: s.longitude }));
      box.hidden = false;

      if (km(bus, pts[boardIdx]) < 0.15) {
        box.textContent = "Your bus is at your boarding stop.";
        return;
      }

      let nearest = 0;
      pts.forEach((p, i) => { if (km(bus, p) < km(bus, pts[nearest])) nearest = i; });

      if (nearest > boardIdx) {
        box.textContent = "Your bus has already passed your boarding stop.";
        return;
      }

      let dist = km(bus, pts[nearest]);
      for (let i = nearest; i < boardIdx; i++) dist += km(pts[i], pts[i + 1]);

      const speed = d.speedKmh >= 10 ? d.speedKmh : 20;
      const minutes = Math.max(1, Math.round((dist * 1.3) / speed * 60));

      box.textContent =
        `Estimated arrival at ${stopsOrdered[boardIdx].name}: about ${minutes} min (${dist.toFixed(1)} km away). This is an estimate.`;
    }

    async function pollLocation() {
      try {
        const res = await api(`/api/tracking/routes/${routeId}/location`);
        if (res.status === 204) {
          setPill("", "Bus isn't on the road yet");
          return;
        }
        if (!res.ok) {
          setPill("", `Couldn't get bus position (${res.status})`);
          return;
        }
        const d = await res.json();
        const age = Date.now() - new Date(d.updatedAt).getTime();
        moveBus({ lat: d.latitude, lng: d.longitude });
        updateEta(d, age > STALE_MS);

        if (age > STALE_MS) {
          setPill("stale", `Last seen ${ageText(age)} ago — driver may be offline`);
        } else {
          const speed = d.speedKmh != null ? ` · ${Math.round(d.speedKmh)} km/h` : "";
          setPill("live", "Live" + speed);
        }
      } catch (err) {
        if (err.message !== "Unauthorized") console.error(err);
      }
    }

    function addAlert(a, isNew) {
      const li = document.createElement("li");
      li.className = "alert " + (ALERT_CLASS[a.type] || "") + (isNew ? " is-new" : "");

      const head = document.createElement("div");
      head.className = "alert__head";
      const time = new Date(a.createdAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      head.textContent = `${ALERT_LABELS[a.type] || "Info"} · ${time}`;

      const body = document.createElement("div");
      body.textContent = a.message;

      li.append(head, body);
      $("alertList").prepend(li);
      $("alertEmpty").hidden = true;
    }

    async function pollAlerts(isFirst = false) {
      try {
        const res = await api(`/api/tracking/routes/${routeId}/alerts?sinceId=${lastAlertId}`);
        if (!res.ok) return;
        const alerts = await res.json();
        alerts.forEach((a) => {
          addAlert(a, !isFirst);
          lastAlertId = Math.max(lastAlertId, a.id);
        });
        if (!isFirst && alerts.length && navigator.vibrate) navigator.vibrate(250);
      } catch (err) {
        if (err.message !== "Unauthorized") console.error(err);
      }
    }

    async function init() {
      try {
        const bookings = await (await api("/api/bookings/mine")).json();
        const booking = bookings.find((b) => b.status === "Confirmed");

        if (!booking) {
          $("subtitle").textContent = "";
          $("noBooking").hidden = false;
          return;
        }

        routeId = booking.routeId;
        const routes = await (await api("/api/routes")).json();
        const route = routes.find((r) => r.id === routeId);
        if (!route) throw new Error("Route not found");

        $("subtitle").textContent = `${route.origin} → ${route.destination}`;
        $("tripInfo").textContent =
          `Boarding: ${booking.boardingStop?.name ?? "—"} · Drop-off: ${booking.dropOffStop?.name ?? "—"} · Days: ${booking.days}`;
        $("trackLayout").hidden = false;

        await loadGoogleMaps();
        buildMap(route, booking);

        await pollAlerts(true);
        await pollLocation();

        setInterval(() => {
          if (document.hidden) return;
          pollLocation();
          pollAlerts();
        }, POLL_MS);
      } catch (err) {
        console.error(err);
        if (err.message !== "Unauthorized") {
          $("subtitle").textContent = err.message || "Something went wrong loading your route.";
        }
      }
    }

    $("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("token");
      localStorage.removeItem("authToken");
      window.location.href = "/login.html";
    });

    init();
  </script>
</body>
</html>
