<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commute360 — Reset password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Figtree", system-ui, sans-serif;
      color: #e8eefc;
      background: radial-gradient(900px 500px at 10% -10%, rgba(20,184,166,.35), transparent 60%),
                  radial-gradient(800px 500px at 100% 110%, rgba(251,191,36,.25), transparent 60%), #0a1628;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      padding: 28px;
    }
    .brand { font-weight: 800; letter-spacing: .02em; margin-bottom: 18px; font-size: 18px; }
    .brand span { color: #fbbf24; }
    h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.2; }
    .sub { margin: 0 0 20px; opacity: .85; line-height: 1.5; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 13px; opacity: .85; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(10,22,40,.75);
      color: #e8eefc;
      font: inherit;
      font-size: 16px;
    }
    button {
      display: inline-block;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      font-size: 16px;
      text-align: center;
      cursor: pointer;
      background: linear-gradient(135deg, #ffb800, #e8920a);
      color: #1a1000;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .msg { min-height: 22px; margin-top: 14px; font-size: 14px; line-height: 1.5; }
    .msg.error { color: #fca5a5; }
    .msg.ok { color: #6ee7b7; }
    a { color: #7dd3fc; }
    .foot { margin: 20px 0 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Commute<span>360</span></div>
    <h1>Choose a new password</h1>
    <p class="sub" id="intro">Use at least 8 characters.</p>

    <form id="form" novalidate>
      <div class="field">
        <label for="next">New password</label>
        <input type="password" id="next" autocomplete="new-password" required />
      </div>
      <div class="field">
        <label for="again">Repeat new password</label>
        <input type="password" id="again" autocomplete="new-password" required />
      </div>
      <button type="submit" id="btn">Save new password</button>
      <p class="msg" id="msg" role="status"></p>
    </form>

    <p class="foot"><a href="/login.html">Go to log in</a> &middot; <a href="/forgot-password.html">Request a new link</a></p>
  </main>

  <script>
    const apiBase = (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || "";
    const $ = (id) => document.getElementById(id);
    const token = new URLSearchParams(window.location.search).get("token");

    function show(el, kind, text) {
      el.className = "msg " + kind;
      el.textContent = text;
    }

    if (!token) {
      $("form").hidden = true;
      $("intro").textContent = "This link is missing its token. Please request a new reset link.";
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const next = $("next").value;
      const msg = $("msg");

      if (next.length < 8) { show(msg, "error", "The password must be at least 8 characters."); return; }
      if (next !== $("again").value) { show(msg, "error", "The passwords don't match."); return; }

      $("btn").disabled = true;
      show(msg, "", "Saving…");

      try {
        const res = await fetch(apiBase + "/api/account/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, newPassword: next })
        });

        if (res.ok) {
          show(msg, "ok", "Password updated. Taking you to log in…");
          setTimeout(() => { window.location.href = "/login.html"; }, 1800);
          return;
        }

        if (res.status === 429) {
          show(msg, "error", "Too many attempts. Wait a minute and try again.");
        } else {
          let text = "This link is invalid or has expired. Please request a new one.";
          try {
            const d = await res.json();
            text = d.message || d.title || text;
          } catch {}
          show(msg, "error", text);
        }
      } catch {
        show(msg, "error", "Could not reach the server.");
      } finally {
        $("btn").disabled = false;
      }
    });
  </script>
</body>
</html>
