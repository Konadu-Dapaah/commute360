<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commute360 — Reset password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/dash.css" />
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene__grid"></div>
    <div class="scene__orb scene__orb--a"></div>
    <div class="scene__orb scene__orb--b"></div>
  </div>

  <main class="dash" style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <div class="panel auth-card" style="width:100%">
      <h1 style="margin:0 0 6px;font-size:26px">Choose a new password</h1>
      <p class="muted" style="margin:0 0 18px" id="intro">Use at least 8 characters.</p>

      <form class="form" id="form" novalidate style="max-width:none">
        <div>
          <label for="next">New password</label>
          <input class="input" type="password" id="next" autocomplete="new-password" required />
        </div>
        <div>
          <label for="again">Repeat new password</label>
          <input class="input" type="password" id="again" autocomplete="new-password" required />
        </div>
        <button type="submit" class="cta" id="btn">Save new password</button>
        <p class="msg" id="msg" role="status"></p>
      </form>

      <p style="margin:18px 0 0"><a class="link" href="/login.html">Go to log in</a></p>
    </div>
  </main>

  <script>
    const apiBase = window.location.port ? "" : "http://localhost:5291";
    const $ = (id) => document.getElementById(id);
    const token = new URLSearchParams(window.location.search).get("token");

    function show(text, type) {
      $("msg").textContent = text;
      $("msg").className = "msg" + (type ? ` is-${type}` : "");
    }

    if (!token) {
      $("form").hidden = true;
      $("intro").textContent = "This link is missing its token. Ask for a new reset link from the “Forgot password” page.";
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const next = $("next").value;

      if (next.length < 8) { show("The password must be at least 8 characters.", "error"); return; }
      if (next !== $("again").value) { show("The passwords don't match.", "error"); return; }

      $("btn").disabled = true;
      try {
        const res = await fetch(apiBase + "/api/account/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, newPassword: next })
        });

        if (res.ok) {
          show("Password updated. Redirecting to log in…", "success");
          setTimeout(() => { window.location.href = "/login.html"; }, 1800);
          return;
        }

        if (res.status === 429) { show("Too many attempts. Wait a minute and try again.", "error"); }
        else {
          const type = res.headers.get("content-type") || "";
          let text = "Something went wrong.";
          if (type.includes("json")) {
            const d = await res.json();
            text = d.errors ? Object.values(d.errors).flat().join(" ") : (d.message || d.title || text);
          } else {
            text = (await res.text()) || text;
          }
          show(text, "error");
        }
      } catch {
        show("Could not reach the server.", "error");
      }
      $("btn").disabled = false;
    });
  </script>
</body>
</html>
