<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commute360 — Forgot password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="config.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Figtree', sans-serif;
      background-color: #070e18;
      color: #e8eefc;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .scene {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #112240 0%, #070e18 100%);
    }
    .panel {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin: 0 0 8px;
      font-family: 'Syne', sans-serif;
      font-size: 26px;
    }
    .muted {
      opacity: 0.7;
      font-size: 14px;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      opacity: 0.85;
    }
    .input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(10, 22, 40, 0.8);
      color: #e8eefc;
      font: inherit;
      font-size: 15px;
      box-sizing: border-box;
      margin-bottom: 16px;
    }
    .input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .cta {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      background: linear-gradient(135deg, #ffb800, #e8920a);
      color: #1a1000;
      border: none;
      cursor: pointer;
      transition: filter 0.2s;
    }
    .cta:hover {
      filter: brightness(1.1);
    }
    .msg {
      font-size: 14px;
      margin-top: 14px;
      min-height: 20px;
    }
    .msg.is-error { color: #fca5a5; }
    .msg.is-success { color: #6ee7b7; }
    .link {
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
    }
    .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>

  <main class="panel">
    <h1>Forgot your password?</h1>
    <p class="muted">Enter your email address below and we'll send you a secure link to choose a new password.</p>

    <form id="form" novalidate>
      <div>
        <label for="email">Email address</label>
        <input class="input" type="email" id="email" autocomplete="email" placeholder="e.g. ama@gmail.com" required />
      </div>
      <button type="submit" class="cta" id="btn">Send reset link</button>
      <p class="msg" id="msg" role="status"></p>
    </form>

    <p style="margin: 20px 0 0;"><a class="link" href="login.html">← Back to log in</a></p>
  </main>

  <script>
    const apiBase = (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || "";
    const $ = (id) => document.getElementById(id);

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = $("email").value.trim();
      const msg = $("msg");

      if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)) {
        msg.className = "msg is-error";
        msg.textContent = "Please enter a valid email address.";
        return;
      }

      if (!email) { 
        msg.className = "msg is-error"; 
        msg.textContent = "Please enter your email."; 
        return; 
      }

      $("btn").disabled = true;
      msg.className = "msg";
      msg.textContent = "Sending reset link...";

      try {
        const res = await fetch(apiBase + "/api/account/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        if (res.status === 429) {
          msg.className = "msg is-error";
          msg.textContent = "Too many attempts. Wait a minute and try again.";
        } else if (res.ok) {
          msg.className = "msg is-success";
          const info = await res.json().catch(() => ({}));
          msg.textContent = info.message || "A reset link has been sent to your email. It expires in 1 hour.";
          $("form").reset();
        } else {
          let text = "Please enter a valid email address.";
          try {
            const d = await res.json();
            text = d.message || d.title || text;
          } catch {}
          msg.className = "msg is-error";
          msg.textContent = text;
        }
      } catch (err) {
        console.error(err);
        msg.className = "msg is-error";
        msg.textContent = "Could not reach the server.";
      } finally {
        $("btn").disabled = false;
      }
    });
  </script>
</body>
</html>
