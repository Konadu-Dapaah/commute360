<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commute360 — Forgot password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/dash.css" />
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene__grid"></div>
    <div class="scene__orb scene__orb--a"></div>
    <div class="scene__orb scene__orb--b"></div>
  </div>

  <main class="dash" style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <div class="panel auth-card" style="width:100%">
      <h1 style="margin:0 0 6px;font-size:26px">Forgot your password?</h1>
      <p class="muted" style="margin:0 0 18px">Enter your email and we'll send you a link to choose a new one.</p>

      <form class="form" id="form" novalidate style="max-width:none">
        <div>
          <label for="email">Email</label>
          <input class="input" type="email" id="email" autocomplete="email" required />
        </div>
        <button type="submit" class="cta" id="btn">Send reset link</button>
        <p class="msg" id="msg" role="status"></p>
      </form>

      <p style="margin:18px 0 0"><a class="link" href="/login.html">← Back to log in</a></p>
    </div>
  </main>

  <script>
    const apiBase = window.location.port ? "" : "http://localhost:5291";
    const $ = (id) => document.getElementById(id);

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = $("email").value.trim();
      const msg = $("msg");

      if (!email) { msg.className = "msg is-error"; msg.textContent = "Enter your email."; return; }

      $("btn").disabled = true;
      try {
        const res = await fetch(apiBase + "/api/account/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        if (res.status === 429) {
          msg.className = "msg is-error";
          msg.textContent = "Too many attempts. Wait a minute and try again.";
        } else if (res.ok) {
          msg.className = "msg is-success";
          msg.textContent = "If that email has an account, a reset link is on its way. It expires in 1 hour.";
        } else {
          msg.className = "msg is-error";
          msg.textContent = "Please enter a valid email address.";
        }
      } catch {
        msg.className = "msg is-error";
        msg.textContent = "Could not reach the server.";
      } finally {
        $("btn").disabled = false;
      }
    });
  </script>
</body>
</html>
