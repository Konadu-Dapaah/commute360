<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commute360 — Manage Routes &amp; Stops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/routes.css" />
  <link rel="stylesheet" href="css/dash.css" />
  
  <!-- Configuration & Authentication scripts loaded early in HEAD -->
  <script src="config.js"></script>
  <script src="auth.js"></script>

  <style>
    body { overflow-x: hidden; }
    .page-shell { padding: 16px; max-width: 1200px; margin: 0 auto; }
    .admin-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    @media (max-width: 900px) { .admin-layout { grid-template-columns: 1fr; } }
    .panel { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 20px; color: #e8eefc; margin-bottom: 20px; }
    .panel h2 { margin: 0 0 14px; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; }
    .admin-fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    @media (max-width: 600px) { .admin-fields-row { grid-template-columns: 1fr; } }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; opacity: 0.8; margin-bottom: 6px; font-weight: 500; }
    .input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: rgba(10,22,40,.7); color: #e8eefc; font: inherit; font-size: 14px; box-sizing: border-box; }
    .message { font-size: 14px; min-height: 20px; margin-top: 10px; }
    .message.is-error { color: #fca5a5; }
    .message.is-success { color: #6ee7b7; }
    .route-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 12px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; gap: 10px; }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene__grid"></div>
    <div class="scene__orb scene__orb--a"></div>
    <div class="scene__orb scene__orb--b"></div>
  </div>

  <div class="page-shell dash">
    <header class="topbar">
      <a class="topbar__brand" href="admin-dashboard.html">
        <span class="topbar__name">Commute<span>360</span> · Admin</span>
      </a>
      <div class="topbar__actions">
        <!-- Back to Dashboard Option -->
        <a class="ghost-btn" href="admin-dashboard.html">← Back to Dashboard</a>
        <button type="button" class="ghost-btn" id="logoutBtn">Sign out</button>
      </div>
    </header>

    <div class="page-header">
      <h1>Routes &amp; Stops Management</h1>
      <p>Create routes and pin stops so riders can seamlessly book and track their commutes.</p>
    </div>

    <div class="admin-layout">
      <!-- Left Column: Create Route & Manage Existing Routes -->
      <div>
        <section class="panel">
          <h2>Create Route</h2>
          <form id="routeForm" novalidate>
            <div class="admin-fields-row">
              <div class="field">
                <label for="origin">Origin</label>
                <input type="text" class="input" id="origin" placeholder="e.g. Accra Central" required />
              </div>
              <div class="field">
                <label for="destination">Destination</label>
                <input type="text" class="input" id="destination" placeholder="e.g. Tema" required />
              </div>
            </div>

            <div class="admin-fields-row">
              <div class="field">
                <label for="scheduleTime">Schedule time</label>
                <input type="datetime-local" class="input" id="scheduleTime" required />
              </div>
              <div class="field">
                <label for="capacity">Capacity</label>
                <input type="number" class="input" id="capacity" min="1" placeholder="e.g. 40" required />
              </div>
            </div>

            <button type="submit" class="cta" id="routeBtn" style="width: 100%; margin-top: 8px;">Create route</button>
          </form>
          <p id="routeMsg" class="message" role="status"></p>
        </section>

        <section class="panel">
          <h2>Existing Routes</h2>
          <div id="routeList" style="margin-top: 10px;">
            <p class="muted">Loading routes…</p>
          </div>
        </section>
      </div>

      <!-- Right Column: Add Stop to Route -->
      <div>
        <section class="panel">
          <h2>Add Stop</h2>
          <form id="stopForm" novalidate>
            <div class="admin-fields-row">
              <div class="field">
                <label for="routeId">Route ID</label>
                <input type="number" class="input" id="routeId" min="1" placeholder="Select from left" required />
              </div>
              <div class="field">
                <label for="stopName">Stop name</label>
                <input type="text" class="input" id="stopName" placeholder="e.g. Kaneshie" required />
              </div>
            </div>

            <div class="field">
              <label for="stopSearch">Search for a place (fills coordinates automatically)</label>
              <input type="text" class="input" id="stopSearch" placeholder="e.g. Accra Mall, Ghana" autocomplete="off" />
              <div id="searchResults" style="margin-top:8px;"></div>
              <p id="selectedLocationLabel" style="margin-top:6px; font-size: 0.85rem; opacity: 0.75;"></p>
            </div>

            <div class="admin-fields-row">
              <div class="field">
                <label for="lat">Latitude</label>
                <input type="number" class="input" id="lat" step="any" placeholder="5.6037" required />
              </div>
              <div class="field">
                <label for="lng">Longitude</label>
                <input type="number" class="input" id="lng" step="any" placeholder="-0.1870" required />
              </div>
            </div>

            <div class="field">
              <label for="order">Stop Order</label>
              <input type="number" class="input" id="order" min="0" placeholder="0" required />
            </div>

            <button type="submit" class="cta" id="stopBtn" style="width: 100%; margin-top: 8px;">Add stop</button>
          </form>
          <p id="stopMsg" class="message" role="status"></p>
        </section>
      </div>
    </div>
  </div>

  <script>
    const apiBase = (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || "";
    let me = null;

    function setMessage(el, text, type) {
      el.textContent = text;
      el.className = "message" + (type ? ` is-${type}` : "");
    }

    async function parseErrorMessage(res) {
      try {
        const data = await res.json();
        if (data.errors) {
          return Object.entries(data.errors)
            .map(([field, errs]) => `${field}: ${errs.join(", ")}`)
            .join(" | ");
        }
        if (data.message) return data.message;
        if (typeof data === "string") return data;
        return JSON.stringify(data);
      } catch {
        return `Server error ${res.status}`;
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", () => Auth.logout());

    // ---------- Place search (Nominatim) — fills lat/lng from a typed name ----------
    const searchInput = document.getElementById("stopSearch");
    const resultsEl = document.getElementById("searchResults");
    let searchTimeout;

    searchInput.addEventListener("input", () => {
      clearTimeout(searchTimeout);
      const query = searchInput.value.trim();
      if (query.length < 3) {
        resultsEl.innerHTML = "";
        return;
      }
      searchTimeout = setTimeout(() => searchPlace(query), 500);
    });

    async function searchPlace(query) {
      resultsEl.innerHTML = `<p style="opacity:0.7;">Searching…</p>`;
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5`,
          { headers: { "Accept-Language": "en" } }
        );
        const places = await res.json();

        if (!Array.isArray(places) || places.length === 0) {
          resultsEl.innerHTML = `<p style="opacity:0.7;">No results found.</p>`;
          return;
        }

        resultsEl.innerHTML = "";
        places.forEach((place) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "ghost-btn";
          btn.style.display = "block";
          btn.style.width = "100%";
          btn.style.textAlign = "left";
          btn.style.marginBottom = "6px";
          btn.textContent = place.display_name;
          btn.onclick = () => selectPlace(place);
          resultsEl.appendChild(btn);
        });
      } catch (err) {
        console.error(err);
        resultsEl.innerHTML = `<p style="color:#fca5a5;">Search failed. Try again.</p>`;
      }
    }

    function selectPlace(place) {
      document.getElementById("lat").value = parseFloat(place.lat).toFixed(6);
      document.getElementById("lng").value = parseFloat(place.lon).toFixed(6);
      document.getElementById("selectedLocationLabel").textContent =
        `Selected: ${place.display_name} (${parseFloat(place.lat).toFixed(5)}, ${parseFloat(place.lon).toFixed(5)})`;
      resultsEl.innerHTML = "";
      searchInput.value = place.display_name;
    }

    // ---------- Load existing routes ----------
    async function loadRouteList() {
      try {
        const res = await Auth.api("/api/routes");
        if (!res.ok) return;

        const routes = await res.json();
        const container = document.getElementById("routeList");
        if (!container) return;

        container.innerHTML = "";
        if (routes.length === 0) {
          container.innerHTML = "<p class='muted'>No routes found.</p>";
          return;
        }

        routes.forEach(r => {
          const div = document.createElement("div");
          div.className = "route-item";

          const stopsText = (r.stops && r.stops.length > 0) 
            ? `${r.stops.length} stop(s)` 
            : "No stops yet";

          div.innerHTML = `
            <div>
              <strong>${r.origin} → ${r.destination}</strong><br>
              <small class="muted">ID: ${r.id} · ${stopsText}</small>
            </div>
            <div style="display:flex; gap:6px;">
              <button type="button" class="mini-btn" onclick="document.getElementById('routeId').value = '${r.id}'; window.scrollTo({top: 0, behavior: 'smooth'});">Add Stop</button>
              <button type="button" class="mini-btn" style="color: #fca5a5;" onclick="deleteRoute(${r.id})">Delete</button>
            </div>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        console.error("Failed to load routes:", err);
      }
    }

    async function deleteRoute(id) {
      if (!confirm("Are you sure you want to delete this route?")) return;
      try {
        const res = await Auth.api(`/api/routes/${id}`, { method: "DELETE" });
        if (res.ok) {
          loadRouteList();
        } else {
          alert("Failed to delete route: " + await parseErrorMessage(res));
        }
      } catch (err) {
        alert("Could not connect to the API.");
      }
    }

    // ---------- Submit Create Route ----------
    document.getElementById("routeForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const origin = document.getElementById("origin").value.trim();
      const destination = document.getElementById("destination").value.trim();
      const scheduleTimeInput = document.getElementById("scheduleTime").value;
      const capacity = parseInt(document.getElementById("capacity").value, 10);
      const routeBtn = document.getElementById("routeBtn");
      const routeMsg = document.getElementById("routeMsg");

      if (!origin || !destination || !scheduleTimeInput || !capacity) {
        setMessage(routeMsg, "Please fill in all route fields.", "error");
        return;
      }

      const scheduleTime = new Date(scheduleTimeInput).toISOString();
      routeBtn.disabled = true;
      setMessage(routeMsg, "");

      try {
        const res = await Auth.api(`/api/routes`, {
          method: "POST",
          body: JSON.stringify({ origin, destination, scheduleTime, capacity })
        });

        if (res.ok) {
          const data = await res.json();
          setMessage(routeMsg, `Created route ID: ${data.id}`, "success");
          document.getElementById("routeId").value = data.id;
          document.getElementById("routeForm").reset();
          loadRouteList();
        } else {
          setMessage(routeMsg, "Failed: " + await parseErrorMessage(res), "error");
        }
      } catch (err) {
        setMessage(routeMsg, "Could not connect to the API.", "error");
      } finally {
        routeBtn.disabled = false;
      }
    });

    // ---------- Submit Add Stop ----------
    // ---------- Submit Add Stop ----------
    document.getElementById("stopForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const routeId = document.getElementById("routeId").value;
      const name = document.getElementById("stopName").value.trim();
      const latitude = parseFloat(document.getElementById("lat").value);
      const longitude = parseFloat(document.getElementById("lng").value);
      const order = parseInt(document.getElementById("order").value, 10);
      const stopBtn = document.getElementById("stopBtn");
      const stopMsg = document.getElementById("stopMsg");

      if (!routeId || !name || Number.isNaN(latitude) || Number.isNaN(longitude) || Number.isNaN(order)) {
        setMessage(stopMsg, "Please fill in all stop fields correctly.", "error");
        return;
      }

      stopBtn.disabled = true;
      setMessage(stopMsg, "");

      try {
        const res = await Auth.api(`/api/routes/${routeId}/stops`, {
          method: "POST",
          body: JSON.stringify({ name, latitude, longitude, order })
        });

        if (res.ok) {
          setMessage(stopMsg, "Stop successfully added!", "success");
          document.getElementById("stopName").value = "";
          document.getElementById("stopSearch").value = "";
          document.getElementById("selectedLocationLabel").textContent = "";
          document.getElementById("lat").value = "";
          document.getElementById("lng").value = "";
          document.getElementById("order").value = "";
          loadRouteList();
        } else {
          setMessage(stopMsg, "Failed: " + await parseErrorMessage(res), "error");
        }
      } catch (err) {
        setMessage(stopMsg, "Could not connect to the API.", "error");
      } finally {
        stopBtn.disabled = false;
      }
    });
